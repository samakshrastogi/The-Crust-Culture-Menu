<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>The Crust Culture</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        body {
            background: #302d0d;
            font-family: Poppins, sans-serif;
        }

        .cinzel {
            font-family: 'Cinzel', serif;
        }

        .bg-luxury {
            background: linear-gradient(180deg, #050505, #070707);
        }

        .gold {
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page {
            width: 900px;
            height: 1200px;
            position: relative;
            padding: 70px 60px;
            background: transparent;
        }

        .page::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 4px solid #facc15;
        }

        .ribbon {
            background: linear-gradient(90deg, #facc15, #fde68a, #facc15);
            padding: 0 28px 12px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #000;
            margin: 0 auto;
        }

        .price-col {
            width: 60px;
            text-align: center;
            white-space: nowrap;
        }

        .single-price {
            text-align: right;
            white-space: nowrap;
        }

        .packaged-price {
            width: 180px;
            min-width: 180px;
            max-width: 180px;
            display: flex;
            align-items: flex-start;
            position: relative;
            white-space: nowrap;
            overflow: visible;
        }

        .price-note {
            position: absolute;
            left: 60px;
        }

        .section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
        }

        .section.compact {
            gap: 28px;
        }

        .section.compact .ribbon {
            padding: 0 22px 10px;
            letter-spacing: 2px;
        }

        .section.compact .menu-copy {
            width: 540px;
        }

        .section.compact .food-frame {
            width: 210px;
            height: 210px;
        }

        .section.compact .menu-item {
            padding: 2px 0;
        }

        .section.compact .menu-item-name {
            line-height: 1.05;
        }

        .section.compact .menu-item-toppings {
            line-height: 1.1;
            margin-top: 1px;
        }

        .section.compact .price-col {
            width: 50px;
        }

        .section.compact .price-label {
            width: 50px;
        }

        .page.dense-four {
            padding: 50px 56px;
        }

        .page.dense-four .section {
            gap: 26px;
        }

        .page.dense-four .menu-copy {
            width: 550px;
        }

        .page.dense-four .food-frame {
            width: 205px;
            height: 205px;
        }

        .page.dense-four .ribbon {
            padding: 0 22px 9px;
            letter-spacing: 2.4px;
        }

        .page.dense-four .menu-item {
            padding: 1px 0;
        }

        .page.dense-four .price-col {
            width: 50px;
        }

        .availability-note {
            position: absolute;
            top: 34px;
            right: 52px;
            color: #facc15;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            z-index: 2;
        }

        h1 {
            text-shadow:
                0 0 15px rgba(250, 204, 21, 0.6),
                0 0 30px rgba(250, 204, 21, 0.3);
        }

        .menu-glow {
            display: none;
        }

        .food-img {
            transform: scale(1.02);
            transition: 0.4s;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        @media screen {
            .section:hover .food-img {
                transform: scale(1.08);
            }
        }

        * {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
    </style>
</head>

<body class="flex flex-col items-center gap-10 py-10">

    <!-- COVER -->
    <div id="cover"
        class="page bg-luxury text-white flex flex-col items-center justify-center relative overflow-hidden">

        <div class="absolute inset-0 border-4 border-yellow-400"></div>
        <div class="absolute inset-5 border border-yellow-400"></div>

        <img src="images/header.png" class="absolute top-6 w-[420px] opacity-90">
        <img src="images/header.png" class="absolute top-[480px] w-[260px] opacity-90">

        <div class="menu-glow"></div>

        <div class="flex flex-col items-center text-center z-10">

            <h1 class="cinzel text-[110px] gold tracking-[0.15em]">
                MENU
            </h1>

            <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-[1px] bg-gradient-to-r from-transparent via-yellow-400 to-transparent"></div>
                <span class="text-yellow-400 text-lg">✦</span>
                <div class="flex-1 h-[1px] bg-gradient-to-r from-transparent via-yellow-400 to-transparent"></div>
            </div>

            <h2 class="cinzel text-3xl gold tracking-[0.5em]">
                THE CRUST CULTURE
            </h2>

            <p class="mt-6 text-gray-300 tracking-[0.3em] text-sm">
                ✦ Premium Taste Experience ✦
            </p>

            <div class="mt-4 text-yellow-400 text-lg font-mono space-y-2">
    <div class="flex items-center gap-2">
        <span>☎</span><span>+91 83681 51650</span>
    </div>
    <div class="flex items-center gap-2">
        <span>☎</span><span>+91 92176 51191</span>
    </div>
</div>
            

        </div>

        <div class="absolute bottom-28 flex gap-12 px-8 py-5 rounded-2xl 
            border border-yellow-400/20 
            bg-black/40 
            shadow-[0_0_40px_rgba(234,179,8,0.25)]">
            <div class="flex flex-col items-center">
                <div class="bg-white rounded-md shadow-lg">
                    <img src="images/zomato-qr.png" class="w-[120px] h-[120px]">
                </div>
                <span class="text-xs mt-2 text-yellow-400 tracking-wider">SCAN FOR ZOMATO OFFERS</span>
            </div>

            <div class="flex flex-col items-center">
                <div class="bg-white rounded-md shadow-lg">
                    <img src="images/whatsapp-qr.png" class="w-[120px] h-[120px]">
                </div>
                <span class="text-xs mt-2 text-yellow-400 tracking-wider">EXCLUSIVE OFFERS</span>
            </div>
        </div>

        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 text-center text-sm text-yellow-300 tracking-wide">
            Packaging Charges: 10 / 20 / 30 Rs
        </div>
    </div>

    <div id="pages"></div>

    <button id="downloadBtn" class="fixed bottom-10 right-10 bg-yellow-400 px-6 py-2 font-semibold">
        Download PDF
    </button>

    <script src="menu-data.js"></script>

    <script>
        const pagesContainer = document.getElementById("pages");

        // ✅ RENDER SECTION
        function renderSection(sec, reverse) {
            const isCompact = sec.compact === true;

            const labelsRow = sec.labels && sec.labels[0] !== "" ? `
                <div class="flex justify-end mt-2">
                    ${sec.labels.map(l => `<div class="price-col price-label text-xs text-yellow-300">${l}</div>`).join("")}
                </div>` : "";

            const items = sec.items.map(i => {
                const hasSingleInlinePrice = i.prices.length === 1 && sec.labels && sec.labels.length > 1;
                const priceCells = i.prices.map(p => {
                    const packagedPrice = p.match(/^(\d+)\s*(\(.+\))$/);

                    if (packagedPrice) {
                        return `
                            <div class="packaged-price text-yellow-400">
                                <div class="price-col">${packagedPrice[1]}</div>
                                <div class="price-note">${packagedPrice[2]}</div>
                            </div>
                        `;
                    }

                    return `
                        <div class="${hasSingleInlinePrice ? 'single-price' : 'price-col'} text-yellow-400">${p}</div>
                    `;
                }).join("");

                return `
                <div class="menu-item grid grid-cols-[1fr_auto] items-start gap-x-3 py-1">
                    <div class="min-w-0">
                        <div class="flex items-center">
                            <span class="menu-item-name shrink-0">${i.name.toUpperCase()}</span>
                            <div class="flex-1 h-[1px] bg-gray-600 mx-3"></div>
                        </div>

                        ${i.toppings ? `
                            <div class="menu-item-toppings text-[9px] text-gray-400 ml-1 mt-[2px] italic tracking-wide whitespace-normal break-words leading-snug pr-2">
                                ${i.toppings}
                            </div>
                        ` : ""}
                    </div>

                    <div class="flex pt-[1px]">
                        ${priceCells}
                    </div>
                </div>
            `;
            }).join("");

            const text = `
                <div class="menu-copy flex flex-col w-[520px]">
                    <div class="ribbon text-center">${sec.title}</div>
                    ${labelsRow}
                    ${items}
                </div>
            `;

            const image = `
                <div class="food-frame relative w-[250px] h-[250px] rounded-full border border-yellow-400 overflow-hidden bg-black/60 flex items-center justify-center">
                    <div class="food-img" style="background-image: url('${sec.image}')"></div>
                </div>
            `;

            return reverse ? image + text : text + image;
        }

        // ✅ BUILD PAGE
        function buildPage(sections, isLast = false) {
            let el = document.createElement("div");
            const isDenseFour = sections.length === 4;
            const showAvailability = sections[0]?.title === "Extra Toppings";
            el.className = `page bg-luxury text-white ${isDenseFour ? "dense-four" : ""}`;

            el.innerHTML = `
                <div class="absolute inset-0 border-4 border-yellow-400"></div>
                ${showAvailability ? `<div class="availability-note">Available upto 11:00 pm</div>` : ""}

                <div class="flex flex-col ${isLast ? 'justify-start' : 'justify-between'} h-full ${isDenseFour ? 'py-2 gap-2' : 'py-6 gap-6'}">
                    ${sections.map((s, i) => `
                        <div class="section ${s.compact ? 'compact' : ''}">
                            ${renderSection(s, i % 2)}
                        </div>
                    `).join("")}
                </div>
            `;

            return el;
        }

        // 🔥 PAGINATION LOGIC
        // Cover is already fixed as page 1.
        // Content pages rule:
        // page 2 => 3 items, page 3 => 2 items, remaining => 3 items each.
        // Special case:
        // once "Hot & Cold Beverages" appears, end that page immediately
        // so the following section starts on the next page.
        const pageCapacities = [3, 2];
        const forcePageBreakAfter = new Set([
            "Drinks Corner  🥤"
        ]);
        const pages = [];
        let currentPage = [];
        let pageIndex = 0;

        function getPageCapacity(index, sections = currentPage) {
            if (sections[0]?.title === "Sweet Corn Specials 🌽") return 4;
            if (sections[0]?.title === "Garlic Breads & Sides 🥖") return 4;
            return pageCapacities[index] || 3;
        }

        function pushCurrentPage() {
            if (!currentPage.length) return;
            pages.push(currentPage);
            currentPage = [];
            pageIndex++;
        }

        MENU_DATA.forEach((section) => {
            currentPage.push(section);

            if (forcePageBreakAfter.has(section.title)) {
                pushCurrentPage();
                return;
            }

            if (currentPage.length === getPageCapacity(pageIndex)) {
                pushCurrentPage();
            }
        });

        pushCurrentPage();

        // =====================
        // RENDER
        // =====================
        pages.forEach((p, i) => {
            pagesContainer.appendChild(
                buildPage(p, i === pages.length - 1)
            );
        }); 
        // PDF
        async function downloadAll() {
            const { jsPDF } = window.jspdf;

            await document.fonts.ready;

            let pdf = new jsPDF("p", "px", [900, 1200]);

            let elements = [
                document.getElementById("cover"),
                ...document.querySelectorAll(".page:not(#cover)")
            ];

            for (let i = 0; i < elements.length; i++) {

                let canvas = await html2canvas(elements[i], {
                    scale: 3,
                    useCORS: true,
                    backgroundColor: "#302d0d"
                });

                let img = canvas.toDataURL("image/jpeg", 0.95);

                if (i > 0) pdf.addPage([900, 1200]);

                pdf.addImage(img, "JPEG", 0, 0, 900, 1200);
            }

            pdf.save("The-Crust-Culture-Menu.pdf");
        }

        document.getElementById("downloadBtn")
            .addEventListener("click", downloadAll);
    </script>

</body>

</html>
