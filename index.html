<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>The Crust Culture</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        body {
            background: #0a0a0a;
            font-family: Poppins, sans-serif;
        }

        /* FONT */
        .cinzel {
            font-family: 'Cinzel', serif;
        }

        .bg-luxury {
            background: linear-gradient(180deg, #030303 0%, #0a0a0a 100%);
        }

        /* GOLD TEXT */
        .gold {
            /*background: linear-gradient(90deg, #facc15, #fff3b0, #eab308); */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* BACKGROUND (PDF SAFE) */
        .bg-luxury {
            background: linear-gradient(180deg, #050505 0%, #070707 100%);
        }

        /* PAGE */
        .page {
            width: 900px;
            height: 1200px;
            position: relative;
            padding: 70px 60px;
            background: transparent;
        }

        /* BORDER FRAME */
        .page::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 4px solid #facc15;
            pointer-events: none;
        }

        /* INNER BORDER */
        .page .inner-border {
            position: absolute;
            inset: 20px;
            border: 1px solid #facc15;
            pointer-events: none;
        }

        /* PREMIUM RIBBON */
        .ribbon {
            background: linear-gradient(90deg, #facc15, #fde68a, #facc15);
            padding: 0 28px 12px 28px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #000;
            margin: 0 auto;
            border-radius: 4px;
        }

        /* PRICE */
        .price-col {
            width: 60px;
            text-align: center;
        }

        /* SECTION */
        .section {
            display: flex;
            justify-content: space-between;
            gap: 40px;
        }

        /* TITLE GLOW (SAFE) */
        h1 {
            text-shadow:
                0 0 15px rgba(250, 204, 21, 0.6),
                0 0 30px rgba(250, 204, 21, 0.3);
        }

        /* SUBTLE DIVIDER */
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(250, 204, 21, 0.25), transparent);
            margin: 10px 0;
        }

        /* IMAGE STYLE */
        .food-img {
            transform: scale(1.08);
            transition: transform 0.4s ease;
        }

        /* HOVER (ONLY SCREEN) */
        @media screen {
            .section:hover .food-img {
                transform: scale(1.15);
            }
        }

        /* DISABLE PROBLEMATIC EFFECTS IN PDF */
        .menu-glow {
            display: none;
        }

        /* PRINT FIX */
        * {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
    </style>
</head>

<body class="flex flex-col items-center gap-10 py-10">

    <!-- COVER -->
    <div id="cover"
        class="page bg-luxury text-white flex flex-col items-center justify-center relative overflow-hidden">

        <div class="absolute inset-0 border-4 border-yellow-400"></div>
        <div class="absolute inset-5 border border-yellow-400"></div>

        <!-- ORNAMENTS -->
        <img src="images/header.png" class="absolute top-6 w-[420px] opacity-90">
        <img src="images/header.png" class="absolute top-[480px] w-[260px] opacity-90">

        <!-- GLOW -->
        <div class="menu-glow"></div>

        <div class="flex flex-col items-center text-center z-10">

            <h1 class="cinzel text-[110px] gold tracking-[0.15em]">
                MENU
            </h1>

            <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-[1px] bg-gradient-to-r from-transparent via-yellow-400 to-transparent"></div>
                <span class="text-yellow-400 text-lg">✦</span>
                <div class="flex-1 h-[1px] bg-gradient-to-r from-transparent via-yellow-400 to-transparent"></div>
            </div>

            <h2 class="cinzel text-3xl gold tracking-[0.5em]">
                THE CRUST CULTURE
            </h2>

            <p class="mt-6 text-gray-300 tracking-[0.3em] text-sm">
                ✦ Premium Taste Experience ✦
            </p>

            <p class="mt-4 text-yellow-400 text-lg tracking-widest">
                ☎ +91 83681 51650
            </p>

        </div>

        <!-- QR SECTION (IMPROVED) -->
        <div class="absolute bottom-20 flex gap-12 px-8 py-5 rounded-2xl 
            border border-yellow-400/20 
            bg-black/40 
            shadow-[0_0_40px_rgba(234,179,8,0.25)]">

            <div class="flex flex-col items-center">
                <div class="bg-white rounded-md shadow-lg">
                    <img src="images/zomato-qr.png" class="w-[120px] h-[120px]">
                </div>
                <span class="text-xs mt-2 text-yellow-400 tracking-wider">SCAN FOR ZOMATO OFFERS</span>
            </div>

            <div class="flex flex-col items-center">
                <div class="bg-white rounded-md shadow-lg">
                    <img src="images/whatsapp-qr.png" class="w-[120px] h-[120px]">
                </div>
                <span class="text-xs mt-2 text-yellow-400 tracking-wider">EXCLUSIVE OFFERS</span>
            </div>

        </div>

    </div>

    <div id="pages"></div>

    <button id="downloadBtn" class="fixed bottom-10 right-10 bg-yellow-400 px-6 py-2 font-semibold">
        Download PDF
    </button>

    <script src="menu-data.js"></script>

    <script>
        const pagesContainer = document.getElementById("pages");

        function renderSection(sec, reverse) {
            const labelsRow = sec.labels && sec.labels[0] !== "" ? `
<div class="flex justify-end mt-2">
    ${sec.labels.map(l => `
        <div class="price-col text-xs text-yellow-300 tracking-widest">
            ${l}
        </div>
    `).join("")}
</div>
` : "";

            const items = sec.items.map(i => `
<div class="flex items-center py-1">
    <div class="flex items-center w-full">
        <span>${i.name.toUpperCase()}</span>
        <div class="flex-1 h-[1px] bg-gray-600 mx-3"></div>
    </div>
    <div class="flex">
        ${i.prices.map(p => `<div class="price-col text-yellow-400">${p}</div>`).join("")}
    </div>
</div>
`).join("");

            const text = `
<div class="flex flex-col w-[520px]">
<div class="ribbon text-center">${sec.title}</div>
${labelsRow}
${items}
</div>
`;

            const image = `
<div class="relative w-[250px] h-[250px] rounded-full border border-yellow-400 overflow-hidden bg-black flex items-center justify-center shadow-[0_0_20px_rgba(250,204,21,0.25)]">

    <img src="${sec.image}" 
         class="food-img w-full h-full object-cover transition-transform duration-500">

</div>
`;

            return reverse ? image + text : text + image;
        }

        function buildPage(sections) {
            let el = document.createElement("div");
            el.className = "page bg-luxury text-white";

            el.innerHTML = `
<div class="absolute inset-0 border-4 border-yellow-400"></div>
<div class="absolute inset-5 border border-yellow-400"></div>

<div class="flex flex-col justify-between h-full py-6">
${sections.map((s, i) => `<div class="section">${renderSection(s, i % 2)}</div>`).join("")}
</div>
`;

            return el;
        }

        let chunk = 3;
        for (let i = 0; i < MENU_DATA.length; i += chunk) {
            pagesContainer.appendChild(buildPage(MENU_DATA.slice(i, i + chunk)));
        }
        async function waitForImages() {
            const images = document.querySelectorAll("img");
            await Promise.all([...images].map(img => {
                if (img.complete) return Promise.resolve();
                return new Promise(res => {
                    img.onload = img.onerror = res;
                });
            }));
        }
        async function downloadAll() {
            const { jsPDF } = window.jspdf;

            await document.fonts.ready;

            let pdf = new jsPDF("p", "px", [900, 1200]);

            let pages = document.querySelectorAll(".page:not(#cover)");
            let elements = [document.getElementById("cover"), ...pages];

            for (let i = 0; i < elements.length; i++) {

                let canvas = await html2canvas(elements[i], {
                    scale: 3.5,
                    useCORS: true,
                    backgroundColor: "#050505"
                });

                let img = canvas.toDataURL("image/jpeg", 0.95);

                if (i > 0) pdf.addPage([900, 1200]);

                pdf.addImage(img, "JPEG", 0, 0, 900, 1200, undefined, "FAST");
            }

            pdf.save("The-Crust-Culture-Menu.pdf");
        }
        document.getElementById("downloadBtn").addEventListener("click", downloadAll);
    </script>

</body>

</html>
