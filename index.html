<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>The Crust Culture</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        body {
            background: #0a0a0a;
            font-family: Poppins, sans-serif;
        }

        .cinzel {
            font-family: 'Cinzel', serif;
        }

        .bg-luxury {
            background: linear-gradient(180deg, #050505, #070707);
        }

        .gold {
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page {
            width: 900px;
            height: 1200px;
            position: relative;
            padding: 70px 60px;
            background: transparent;
        }

        .page::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 4px solid #facc15;
        }

        .ribbon {
            background: linear-gradient(90deg, #facc15, #fde68a, #facc15);
            padding: 0 28px 12px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #000;
            margin: 0 auto;
        }

        .price-col {
            width: 60px;
            text-align: center;
        }

        .section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
        }

        h1 {
            text-shadow:
                0 0 15px rgba(250, 204, 21, 0.6),
                0 0 30px rgba(250, 204, 21, 0.3);
        }

        .menu-glow {
            display: none;
        }

        .food-img {
            transform: scale(1.08);
            transition: 0.4s;
        }

        @media screen {
            .section:hover .food-img {
                transform: scale(1.15);
            }
        }

        * {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
    </style>
</head>

<body class="flex flex-col items-center gap-10 py-10">

    <!-- COVER -->
    <div id="cover"
        class="page bg-luxury text-white flex flex-col items-center justify-center relative overflow-hidden">

        <div class="absolute inset-0 border-4 border-yellow-400"></div>
        <div class="absolute inset-5 border border-yellow-400"></div>

        <img src="header.png" class="absolute top-6 w-[420px] opacity-90">
        <img src="header.png" class="absolute top-[480px] w-[260px] opacity-90">

        <div class="menu-glow"></div>

        <div class="flex flex-col items-center text-center z-10">

            <h1 class="cinzel text-[110px] gold tracking-[0.15em]">
                MENU
            </h1>

            <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-[1px] bg-gradient-to-r from-transparent via-yellow-400 to-transparent"></div>
                <span class="text-yellow-400 text-lg">✦</span>
                <div class="flex-1 h-[1px] bg-gradient-to-r from-transparent via-yellow-400 to-transparent"></div>
            </div>

            <h2 class="cinzel text-3xl gold tracking-[0.5em]">
                THE CRUST CULTURE
            </h2>

            <p class="mt-6 text-gray-300 tracking-[0.3em] text-sm">
                ✦ Premium Taste Experience ✦
            </p>

            <div class="mt-4 text-yellow-400 text-lg font-mono space-y-2">
    <div class="flex items-center gap-2">
        <span>☎</span><span>+91 83681 51650</span>
    </div>
    <div class="flex items-center gap-2">
        <span>☎</span><span>+91 92176 51191</span>
    </div>
</div>
            

        </div>

        <div class="absolute bottom-20 flex gap-12 px-8 py-5 rounded-2xl 
            border border-yellow-400/20 
            bg-black/40 
            shadow-[0_0_40px_rgba(234,179,8,0.25)]">

            <div class="flex flex-col items-center">
                <div class="bg-white rounded-md shadow-lg">
                    <img src="zomato-qr.png" class="w-[120px] h-[120px]">
                </div>
                <span class="text-xs mt-2 text-yellow-400 tracking-wider">SCAN FOR ZOMATO OFFERS</span>
            </div>

            <div class="flex flex-col items-center">
                <div class="bg-white rounded-md shadow-lg">
                    <img src="whatsapp-qr.png" class="w-[120px] h-[120px]">
                </div>
                <span class="text-xs mt-2 text-yellow-400 tracking-wider">EXCLUSIVE OFFERS</span>
            </div>

        </div>
    </div>

    <div id="pages"></div>

    <button id="downloadBtn" class="fixed bottom-10 right-10 bg-yellow-400 px-6 py-2 font-semibold">
        Download PDF
    </button>

    <script src="menu-data.js"></script>

    <script>
        const pagesContainer = document.getElementById("pages");

        // ✅ RENDER SECTION
        function renderSection(sec, reverse) {

            const labelsRow = sec.labels && sec.labels[0] !== "" ? `
                <div class="flex justify-end mt-2">
                    ${sec.labels.map(l => `<div class="price-col text-xs text-yellow-300">${l}</div>`).join("")}
                </div>` : "";

            const items = sec.items.map(i => `
                <div class="grid grid-cols-[1fr_auto] items-start gap-x-3 py-1">
                    <div class="min-w-0">
                        <div class="flex items-center">
                            <span class="shrink-0">${i.name.toUpperCase()}</span>
                            <div class="flex-1 h-[1px] bg-gray-600 mx-3"></div>
                        </div>

                        ${i.toppings ? `
                            <div class="text-[11px] text-gray-400 ml-1 mt-[2px] italic tracking-wide whitespace-normal break-words leading-snug pr-2">
                                ${i.toppings}
                            </div>
                        ` : ""}
                    </div>

                    <div class="flex pt-[1px]">
                        ${i.prices.map(p => `<div class="price-col text-yellow-400">${p}</div>`).join("")}
                    </div>
                </div>
            `).join("");

            const text = `
                <div class="flex flex-col w-[520px]">
                    <div class="ribbon text-center">${sec.title}</div>
                    ${labelsRow}
                    ${items}
                </div>
            `;

            const image = `
                <div class="relative w-[250px] h-[250px] rounded-full border border-yellow-400 overflow-hidden bg-black flex items-center justify-center">
                    <img src="${sec.image}" class="food-img w-full h-full object-cover">
                </div>
            `;

            return reverse ? image + text : text + image;
        }

        // ✅ BUILD PAGE
        function buildPage(sections, isLast = false) {
            let el = document.createElement("div");
            el.className = "page bg-luxury text-white";

            el.innerHTML = `
                <div class="absolute inset-0 border-4 border-yellow-400"></div>

                <div class="flex flex-col ${isLast ? 'justify-start' : 'justify-between'} h-full py-6 gap-6">
                    ${sections.map((s, i) => `
                        <div class="section">
                            ${renderSection(s, i % 2)}
                        </div>
                    `).join("")}
                </div>
            `;

            return el;
        }

        // 🔥 PAGINATION LOGIC
        // Cover is already fixed as page 1.
        // Content pages rule:
        // page 2 => 3 items, page 3 => 2 items, remaining => 3 items each.
        const data = [...MENU_DATA];
        const pages = [];

        function takePageItems(count) {
            const pageItems = [];
            for (let i = 0; i < count && data.length; i++) {
                pageItems.push(data.shift());
            }
            return pageItems;
        }

        const secondPageItems = takePageItems(3);
        if (secondPageItems.length) pages.push(secondPageItems);

        const thirdPageItems = takePageItems(2);
        if (thirdPageItems.length) pages.push(thirdPageItems);

        while (data.length) {
            pages.push(takePageItems(3));
        }

        // =====================
        // RENDER
        // =====================
        pages.forEach((p, i) => {
            pagesContainer.appendChild(
                buildPage(p, i === pages.length - 1)
            );
        }); 
        // PDF
        async function downloadAll() {
            const { jsPDF } = window.jspdf;

            await document.fonts.ready;

            let pdf = new jsPDF("p", "px", [900, 1200]);

            let elements = [
                document.getElementById("cover"),
                ...document.querySelectorAll(".page:not(#cover)")
            ];

            for (let i = 0; i < elements.length; i++) {

                let canvas = await html2canvas(elements[i], {
                    scale: 3,
                    useCORS: true,
                    backgroundColor: "#050505"
                });

                let img = canvas.toDataURL("image/jpeg", 0.95);

                if (i > 0) pdf.addPage([900, 1200]);

                pdf.addImage(img, "JPEG", 0, 0, 900, 1200);
            }

            pdf.save("The-Crust-Culture-Menu.pdf");
        }

        document.getElementById("downloadBtn")
            .addEventListener("click", downloadAll);
    </script>

</body>

</html>
